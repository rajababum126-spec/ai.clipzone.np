<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#11172a" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="234" fill="none" stroke="url(#goldGrad)" stroke-width="22" filter="url(#goldGlow)" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#fef08a" stroke-width="4" opacity="0.9" />
  <text x="256" y="230" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="195" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="central" letter-spacing="-3">Ai</text>
  <path d="M 135 330 L 377 330" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <text x="256" y="390" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="58" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">Clipzone</text>
</svg>
